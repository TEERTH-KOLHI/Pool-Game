<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic 8-Ball Pool | Pro Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="css/game-layout.css"/>
    <link rel="shortcut icon" type="image/png" href="assets/sprites/favicon.png"/>
</head>

<body>
    <!-- Luxury Floating HUD Bar -->
    <header class="luxury-hud-bar">
        <div class="hud-brand">
            <span class="hud-ball-icon">🎱</span>
            <span class="hud-title">Classic 8-Ball Pool</span>
            <span class="hud-badge">✦ PRO EDITION</span>
        </div>
        <div class="hud-center">
            <div class="owner-pill">
                <span class="crown-icon">👑</span>
                <span class="gold-text">PRO EDITION</span>
            </div>
            <div class="cloth-selector">
                <button type="button" class="cloth-btn active" data-color="blue" title="Royal Tournament Blue Cloth">
                    <span class="dot dot-blue"></span> Royal Blue
                </button>
                <button type="button" class="cloth-btn" data-color="red" title="Crimson Velvet Cloth">
                    <span class="dot dot-red"></span> Crimson
                </button>
                <button type="button" class="cloth-btn" data-color="green" title="Classic Emerald Cloth">
                    <span class="dot dot-green"></span> Emerald
                </button>
            </div>
        </div>
        <div class="hud-controls">
            <span class="control-tag"><kbd>🖱️ Mouse</kbd> Aim & Shoot</span>
            <span class="control-tag"><kbd>W</kbd> <kbd>S</kbd> Power</span>
            <span class="control-tag"><kbd>Esc</kbd> Menu</span>
        </div>
    </header>

    <div id="gameArea">
        <canvas id="screen" width="2000" height="1000"></canvas>
    </div>

    <!-- Script Loading -->
    <script src="script/lib/LAB.min.js"></script>
    <script>
        $LAB
            .script('script/system/Keys.js').wait()
            .script('script/system/Color.js').wait()
            .script('script/geom/Vector2.js').wait()
            .script('script/input/ButtonState.js').wait()
            .script('script/input/Keyboard.js').wait()
            .script('script/input/Mouse.js').wait()
            .script('script/Global.js').wait()
            .script('script/Canvas2D.js').wait()
            .script('script/game_objects/Score.js').wait()
            .script('script/game_objects/Ball.js').wait()
            .script('script/game_objects/Stick.js').wait()
            .script('script/menu/Label.js').wait()
            .script('script/menu/Button.js').wait()
            .script('script/menu/Menu.js').wait()
            .script('script/menu/MainMenu.js').wait()
            .script('script/AI/Opponent.js').wait()
            .script('script/AI/AIPolicy.js').wait()
            .script('script/AI/AITrainer.js').wait()
            .script('script/game_objects/Player.js').wait()
            .script('script/GamePolicy.js').wait()
            .script('script/GameWorld.js').wait()
            .script('script/Game.js').wait()
            .script('script/Assets.js').wait(function () {
                Game.start('gameArea', 'screen', 1500, 825);
            });

        // Interactive Table Cloth Switcher
        const clothBtns = document.querySelectorAll('.cloth-btn');
        clothBtns.forEach(function (btn) {
            btn.addEventListener('click', function () {
                clothBtns.forEach(function (b) { b.classList.remove('active'); });
                this.classList.add('active');
                const color = this.getAttribute('data-color');
                if (typeof Game !== 'undefined' && typeof Game.setTableCloth === 'function') {
                    Game.setTableCloth(color);
                }
            });
        });
    </script>
</body>
</html>
